name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/test.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/emailtrail
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.18'
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --locked python -c 'import os, tomllib; version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert os.environ["RELEASE_TAG"] == f"v{version}", "Release tag must match package version"'
      - run: uv build
      - run: uv run --locked twine check --strict dist/*
      - run: uv publish --trusted-publishing always
