[project]
name = "emailtrail"
version = "0.5.0"
description = "Analyse email hops: hostnames, protocols, timestamps, and delays."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Akshay Kumar", email = "akshay.kmr4321@gmail.com" }]
keywords = ["email", "headers", "smtp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
]
dependencies = ["dateparser>=1.2.2,<2"]

[project.urls]
Homepage = "https://github.com/akshaykmr/emailtrail"
Issues = "https://github.com/akshaykmr/emailtrail/issues"
Changelog = "https://github.com/akshaykmr/emailtrail/blob/master/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.13,<1", "twine>=7,<8"]
dataset = ["xmltodict>=0.14,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emailtrail"]

[tool.hatch.build.targets.sdist]
include = ["/emailtrail", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE.txt", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
