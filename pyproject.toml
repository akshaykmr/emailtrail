[project]
name = "emailtrail"
version = "0.4.0"
description = "Analyse hops taken by an Email to reach you. Get structured information about each hop - Hostnames, Protocol used, Timestamp, and Delay"
authors = [{ name = "Akshay Kumar", email = "akshay.kmr4321@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["dateparser>=1.2.2,<2", "pytz>=2025.2"]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "xmltodict>=0.14,<2",
    "ruff>=0.13,<1",
    "twine>=7,<8",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emailtrail"]

[tool.ruff]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
