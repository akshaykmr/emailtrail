[project]
name = "emailtrail"
version = "0.4.0"
description = "Analyse hops taken by an Email to reach you. Get structured information about each hop - Hostnames, Protocol used, Timestamp, and Delay"
authors = [{ name = "Akshay Kumar", email = "akshay.kmr4321@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["dateparser>=1.0.0,<2", "pytz>=2021.1,<2022"]

[dependency-groups]
dev = [
    "pytest>=6.2.5,<7",
    "xmltodict>=0.12.0,<0.13",
    "flake8>=3.9.2,<4",
    "black>=21.8b0,<22",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emailtrail"]
